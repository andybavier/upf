name: Publish Test Images

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Fork branch or tag to build
        required: true
        default: bess-integration
        type: string
      tag:
        description: Test image tag to publish
        required: true
        default: bess-integration
        type: string
      cpu:
        description: BESS CPU architecture
        required: true
        default: haswell
        type: choice
        options:
          - haswell
          - ivybridge
          - native

permissions:
  contents: none
  packages: none

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bess
            image: upf-bess
          - target: pfcp
            image: upf-pfcp
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}

      - name: Record source revision
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ steps.source.outputs.short_sha }}
          build-args: |
            CPU=${{ inputs.cpu }}
            MAKEFLAGS=-j2
            VERSION=${{ inputs.tag }}
            VCS_URL=https://github.com/${{ github.repository }}
            VCS_REF=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
